    #工具文件夹
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ $uri/index.html;
        # 按特定规则重写路径，用于前端识别，规则为：gkgzhospital后接任意数字大小写字母
        rewrite ^(.*/)(gkgzhospital[\w|\d]*)/(.*)$ $1$3 break;
        if ($request_filename ~* .*\.(htm|html)$) {
            add_header Cache-Control "no-store";
        }
    }

    # 当前项目 (SPD 供应链管理平台 Demo) 静态资源配置
    location /web-template/ {
        alias /usr/share/nginx/html/spd-demo/dist/;
        index index.html index.htm;
        try_files $uri $uri/ /web-template/index.html;

        # 允许对本地 Mock JSON 文件进行 POST/PUT 等非 GET 方式请求而不报 405
        error_page 405 =200 $uri;

        if ($request_filename ~* .*\.(htm|html)$) {
            add_header Cache-Control "no-store";
        }
    }

    location /api/third {
        proxy_pass http://10.20.231.55:26001;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api {
        # 如果请求来源于当前的 demo 项目，则直接通过 Nginx 拦截并重写读取静态 JSON 文件
        if ($http_referer ~* "web-template") {
            rewrite ^/api/procurement/orders/([^/]+)/items$ /web-template/mock_api/procurement/orders/:id/items.json last;
            rewrite ^/api/procurement/orders/([^/]+)/urge$ /web-template/mock_api/procurement/orders/:id/urge.json last;
            rewrite ^/api/procurement/orders/([^/]+)/receive$ /web-template/mock_api/procurement/orders/:id/receive.json last;
            
            rewrite ^/api/procurement/plan/([^/]+)/items$ /web-template/mock_api/procurement/plan/:id/items.json last;
            rewrite ^/api/procurement/plan/([^/]+)/approve$ /web-template/mock_api/procurement/plan/:id/approve.json last;
            rewrite ^/api/procurement/plan/([^/]+)/convert$ /web-template/mock_api/procurement/plan/:id/convert.json last;
            
            rewrite ^/api/procurement/receiving/([^/]+)/items$ /web-template/mock_api/procurement/receiving/:id/items.json last;
            rewrite ^/api/procurement/receiving/([^/]+)/confirm$ /web-template/mock_api/procurement/receiving/:id/confirm.json last;
            
            rewrite ^/api/procurement/track/([^/]+)/urge$ /web-template/mock_api/procurement/track/:id/urge.json last;

            rewrite ^/api/(.*)$ /web-template/mock_api/$1.json last;
        }

        proxy_pass http://10.20.20.238:19098;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1200s;
        rewrite ^/api/(.*)$ /$1 break;
    }

    # 托管当前项目以绝对路径请求的图片资源 (例如 logo2.png)
    location /images/ {
        alias  /usr/share/nginx/html/spd-demo/dist/images/;
    }

